/* Layout: una revista abierta sobre una mesa verde; dos páginas a la vista y una hoja que gira sobre el lomo. Formas redondeadas, etiquetas tipo sticker y la paleta de ReciPunto. */
:root{
  --stage:#0B4A3A; --ink:#0B4A3A; --text:#12352B; --paper:#FFFDF6; --teal:#12B76A; --leaf:#0A7D4B; --gold:#FFC83D;
  --muted:#5B6B63; --line:#DCE6DC; --mint:#DFF7EA; --cream:#FFF3C9; --soft:#F1F6EE; --red:#FF6B4A; --white:#ffffff; --sky:#2F9BFF;
  --body:"Times New Roman",Times,"Liberation Serif",serif;
  --display:"Fredoka","Trebuchet MS",Verdana,sans-serif;
  --pw:650px; --ph:840px; --s:1; --pad:46px;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#16324a 0%,var(--stage) 75%)}
.book{position:absolute;left:50%;top:50%;width:calc(var(--pw)*2);height:var(--ph);transform:translate(-50%,-50%) scale(var(--s));perspective:3200px;transition:transform .95s cubic-bezier(.45,.05,.35,1)}
.book[data-state="front"]{transform:translate(calc(-50% - var(--pw)*var(--s)/2),-50%) scale(var(--s))}
.book[data-state="back"]{transform:translate(calc(-50% + var(--pw)*var(--s)/2),-50%) scale(var(--s))}
.book.single{transition:none}
.slot:empty{box-shadow:none!important}
.book.single{width:var(--pw)}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.slot.l{left:0;box-shadow:-3px 2px 0 #e6e2d6,-6px 4px 0 #d3cebf,-9px 6px 0 #bdb7a6,-14px 22px 40px rgba(0,0,0,.55)}.slot.r{left:var(--pw);box-shadow:3px 2px 0 #e6e2d6,6px 4px 0 #d3cebf,9px 6px 0 #bdb7a6,14px 22px 40px rgba(0,0,0,.55)}
.book.single .slot.l{display:none}.book.single .slot.r{left:0}
.leaf{position:absolute;top:0;left:var(--pw);width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;z-index:5;will-change:transform}
.book.single .leaf{left:0}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf.fwd{animation:lf .95s cubic-bezier(.45,.05,.35,1) both}
.leaf.bwd{animation:lf .95s cubic-bezier(.45,.05,.35,1) reverse both}
@keyframes lf{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
.book.single .leaf.fwd,.book.single .leaf.bwd{animation-name:lf1;animation-duration:.7s}
@keyframes lf1{from{transform:rotateY(0)}to{transform:rotateY(-112deg);filter:brightness(.5)}}
#measure{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);visibility:hidden;pointer-events:none}

/* página */
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:70px;pointer-events:none}
.pg.left::after{right:0;background:linear-gradient(to left,rgba(8,24,38,.22),rgba(8,24,38,0))}
.pg.right::after{left:0;background:linear-gradient(to right,rgba(8,24,38,.22),rgba(8,24,38,0))}
.book.single .pg::after{display:none}
.rh{position:absolute;top:20px;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);border-bottom:2px solid var(--gold);padding-bottom:5px}
.rh b{color:var(--ink);letter-spacing:.12em}
.folio{position:absolute;bottom:16px;left:var(--pad);right:var(--pad);font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.folio b{color:var(--ink);font-family:var(--display)}
.pg.right .folio{flex-direction:row-reverse}
.pgb{position:absolute;top:60px;bottom:46px;left:var(--pad);right:var(--pad);display:flex;flex-direction:column;gap:11px;overflow:hidden}
.book.single .pgb{overflow-y:auto}
.pgb>*{margin-top:0;margin-bottom:0;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

.band{background:var(--ink);color:var(--white);border-left:8px solid var(--gold);padding:12px 18px}
.pgb>.band:not(:first-child){margin-top:14px}
.band .k{color:var(--gold);font-weight:bold;letter-spacing:.14em;text-transform:uppercase;font-size:12pt}
.band h2{margin:2px 0 0;font-size:14pt;line-height:1.3;text-wrap:balance}
h3{font-size:14pt;margin:4px 0 0;color:var(--ink);border-bottom:2px solid var(--gold);padding-bottom:3px;text-wrap:balance}
p{margin:0 0 10px;text-align:justify;hyphens:auto}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin-bottom:5px;text-align:justify}
.cap{font-size:13px;line-height:1.35;color:var(--muted);text-align:center}
img{display:block;max-width:100%;height:auto}
.photo{width:100%;border-radius:3px}
.box{background:var(--mint);border-left:6px solid var(--teal);padding:12px 16px}
.box.gold{background:var(--cream);border-left-color:var(--gold)}
.box h4{margin:0 0 5px;font-size:14pt}
.box p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.book.single .grid3{grid-template-columns:1fr}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--ink);color:var(--white);text-align:left;padding:6px 10px;font-size:16px}
td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;font-size:16px;line-height:1.3}
td:first-child{background:var(--soft);font-weight:bold}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--teal);overflow-wrap:anywhere}
button{font-family:var(--body);font-size:16px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* portada: dos mitades de una misma imagen */
.pg.cov{background:var(--ink);color:var(--white)}
.cov .bg{position:absolute;top:0;height:100%;width:calc(var(--pw)*2);background:none}
.cov.c1 .bg{left:0}.cov.c2 .bg{left:calc(var(--pw)*-1)}
.book.single .cov .bg{left:0;width:100%}
.cov .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,67,.95) 0%,rgba(15,42,67,.5) 45%,rgba(15,42,67,.9) 100%)}
.cov.c2 .shade{background:linear-gradient(180deg,rgba(15,42,67,.55) 0%,rgba(15,42,67,.82) 40%,rgba(15,42,67,.96) 100%)}
.cov .topbar{position:absolute;inset:0 0 auto 0;height:10px;background:var(--gold)}
.cov .c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:46px var(--pad) 34px}
.cov.c2 .c{justify-content:center;gap:14px}
.cov .ed{color:var(--gold);font-weight:bold;letter-spacing:.08em;font-size:15px}
.mast{font-family:var(--display);font-weight:bold;line-height:.95;margin:10px 0 0;font-size:calc(var(--pw)*.118);letter-spacing:-.01em;white-space:nowrap}
.mast span{display:inline-block}
.mast i{color:var(--gold);font-size:.46em;font-weight:normal;margin-right:.16em}
.cov .tag{border-top:2px solid var(--white);margin-top:16px;padding-top:10px;font-style:italic;font-size:19px;text-align:left}
.cov .lbl{align-self:flex-start;background:var(--gold);color:var(--ink);font-weight:bold;padding:3px 12px;font-size:15px}
.cov h1{font-family:var(--display);font-size:calc(var(--pw)*.058);line-height:1.1;margin:0;text-wrap:balance}
.cov .sub{font-style:italic;font-size:21px;color:#dfe8ee;text-align:left;margin:0}
.cov .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.cov .facts div{border-top:4px solid var(--gold);padding-top:6px;font-size:15px;line-height:1.3}
.cov .facts b{display:block;font-family:var(--display);color:var(--gold);font-size:34px;line-height:1.1;white-space:nowrap}
.open{align-self:flex-start;margin-top:14px;background:var(--gold);color:var(--ink);border:0;font-weight:bold;padding:10px 24px;border-radius:999px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,183,0,.55)}60%,100%{box-shadow:0 0 0 14px rgba(245,183,0,0)}}
.cov .foot{font-size:15px;color:#d5dee5;text-align:left;margin:0;line-height:1.5}
.pg.first .mast span{animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.pg.first .mast span:nth-of-type(2){animation-delay:.18s}.pg.first .mast span:nth-of-type(3){animation-delay:.32s}
@keyframes drop{from{opacity:0;transform:translateY(-40px)}}
.cov.end .c{justify-content:center;align-items:center;text-align:center;gap:16px}
.cov.end .open{align-self:center;animation:none}

/* sumario */
.toc{list-style:none;padding:0}
.toc li{margin:0}
.toc button{width:100%;display:flex;align-items:baseline;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;color:var(--ink);transition:background .2s,padding-left .2s}
.toc button:hover{background:var(--soft);padding-left:12px}
.toc .no{font-family:var(--display);color:var(--teal);font-weight:bold;min-width:2.2ch;font-variant-numeric:tabular-nums}
.toc .t{flex:1}
.toc .d{color:var(--muted);font-size:13px}

/* biografías */
.bio{display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:start}
.bio>div{min-width:0}
.bio img,.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}
.avatar{background:var(--ink);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-weight:bold;font-size:42px}
.bio h4{margin:0;font-size:14pt}
.bio .role{color:var(--teal);font-style:italic;margin-bottom:5px;text-align:left}
.bio p:last-child{margin-bottom:0}

/* tarjetas */
.card{background:var(--white);border:1px solid var(--line);border-top:5px solid var(--teal);padding:11px 14px;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(15,42,67,.16)}
.card h4{margin:0 0 4px;font-size:14pt}
.card p{text-align:left;margin:0;line-height:1.38}
.card.gold{border-top-color:var(--gold)}
.mv{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.mv>div{min-width:0}
.mv h3{margin-top:10px}.mv h3:first-child{margin-top:0}
.mv p{margin:6px 0 0}
.phone{filter:drop-shadow(0 12px 16px rgba(15,42,67,.28))}
.book.single .mv{grid-template-columns:130px 1fr;gap:14px}

/* barras */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 50px;gap:10px;align-items:center}
.bar span{font-size:16px;line-height:1.2}
.bar .tr{background:var(--soft);height:20px;border-radius:3px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:var(--w);background:var(--c,var(--ink))}
.bar b{font-family:var(--display);font-variant-numeric:tabular-nums}
.pg.enter .bar .tr i{animation:grow 1.2s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes grow{from{width:0}}
.stat{text-align:center;padding:10px 8px;background:var(--ink);color:var(--white)}
.stat b{display:block;font-family:var(--display);font-size:30px;white-space:nowrap;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.stat>span{font-size:14px;line-height:1.25;display:block}

/* fases */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tabs button{background:var(--soft);color:var(--ink);border:2px solid var(--ink);padding:6px 16px;border-radius:999px;font-weight:bold;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--gold)}
.phase{border:1px solid var(--line);background:var(--white);padding:12px 16px;border-left:6px solid var(--gold);min-height:150px}
.phase.show{animation:rise .45s both}
.phase h4{margin:0 0 4px;font-size:14pt}
.phase ul{margin-bottom:6px}.phase li{margin-bottom:2px}
.route{display:flex;align-items:center;margin:4px 0}
.route .dot{width:20px;height:20px;border-radius:50%;background:var(--soft);border:3px solid var(--ink);flex:none;transition:background .3s,transform .3s}
.route .dot.on{background:var(--gold);transform:scale(1.25)}
.route .seg{flex:1;height:4px;background:var(--soft);position:relative;overflow:hidden}
.route .seg i{position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.route .seg.on i{transform:scaleX(1)}
.routelbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}

/* tarifas */
.plan{background:var(--white);border:1px solid var(--line);padding:16px 12px 12px;display:flex;flex-direction:column;gap:5px;transition:transform .25s,box-shadow .25s}
.plan:hover{transform:translateY(-6px);box-shadow:0 14px 26px rgba(15,42,67,.18)}
.plan.best{border:2px solid var(--teal);position:relative}
.grid3:has(.plan){padding-top:12px}
.plan.best::before{content:"El más elegido";position:absolute;top:-11px;left:12px;background:var(--teal);color:var(--white);font-size:13px;line-height:1.4;padding:0 10px;border-radius:999px}
.plan h4{margin:0;font-size:14pt}
.plan .pr{font-family:var(--display);font-size:22px;font-weight:bold;line-height:1.1;font-variant-numeric:tabular-nums}
.plan .pr small{display:block;font-size:14px;font-weight:normal;color:var(--muted);font-family:var(--body)}
.plan p{text-align:left;margin:0;line-height:1.3}
.plan .who{color:var(--teal);font-style:italic}
.switch{display:inline-flex;align-self:flex-start;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:6px}
.switch button{border:0;background:var(--white);color:var(--ink);padding:5px 16px}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--gold);font-weight:bold}

/* calculadora */
.calc{background:var(--ink);color:var(--white);padding:14px 18px}
.calc label{display:block;font-weight:bold;margin-bottom:4px}
.calc input[type=range]{width:100%;accent-color:var(--gold)}
.calc .out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.calc .out div{border-top:3px solid var(--gold);padding-top:5px;font-size:14px}
.calc .out b{display:block;font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums}
.calc .verdict{margin-top:10px;padding:6px 12px;font-weight:bold;text-align:center;background:var(--red);color:var(--white);transition:background .3s}
.calc .verdict.ok{background:var(--teal)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;height:140px;border-bottom:2px solid var(--ink);padding-top:22px}
.cols .yr{display:flex;gap:8px;align-items:flex-end;justify-content:center;height:100%}
.cols .col{width:38%;max-width:64px;height:var(--h);background:var(--teal);position:relative}
.cols .col.c2{background:var(--ink)}
.cols .col em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;white-space:nowrap;padding-bottom:2px;font-variant-numeric:tabular-nums}
.pg.enter .cols .col{animation:up 1.1s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes up{from{height:0}}
.colsl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;font-size:14px;margin-top:6px}
.colsl b{display:block}
.neg{color:var(--red)}.pos{color:var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}

.side{display:grid;grid-template-columns:44% 1fr;gap:18px;align-items:start}.side>div{min-width:0}.side p:last-child{margin-bottom:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps div{background:var(--white);border:1px solid var(--line);padding:10px 12px;line-height:1.35}
.steps b{display:block;font-family:var(--display);font-size:26px;color:var(--teal);line-height:1}
.quote{font-family:var(--display);font-size:21px;line-height:1.4;border-left:6px solid var(--gold);padding:8px 0 8px 18px;text-align:left;text-wrap:balance}
p.ref{text-align:left;padding-left:2.2em;text-indent:-2.2em;overflow-wrap:anywhere;line-height:1.34}
.pgb>p.ref{margin-bottom:-5px}
.how{list-style:none;padding:0;margin:0;display:grid;gap:6px}.how li{margin:0;text-align:left}.how b{color:var(--teal)}
.canvas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.book.single .canvas{grid-template-columns:repeat(2,minmax(0,1fr))}
.canvas div{background:var(--soft);padding:8px 10px;font-size:15px;line-height:1.3;transition:transform .2s}
.canvas div:hover{transform:scale(1.03)}
.canvas div.v{background:var(--cream)}.canvas div.m{background:var(--mint)}
.canvas b{display:block;margin-bottom:3px}
.flip{perspective:900px;height:150px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.flip .f{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .f{transform:rotateY(180deg)}
.flip .a,.flip .z{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.flip .a{background:var(--ink);color:var(--white);align-items:center;text-align:center}
.flip .a b{font-family:var(--display);font-size:22px;color:var(--gold);line-height:1.2}
.flip .a small{font-size:13px;color:#cfd9e0}
.flip .z{background:var(--mint);transform:rotateY(180deg);font-size:16px;line-height:1.3}
.flip .z.w{background:var(--cream)}
.flip .z ul{margin:0;padding-left:18px}.flip .z li{text-align:left;margin-bottom:2px}

/* barra inferior */
.nav{flex:none;display:flex;align-items:center;gap:10px;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:var(--white);background:var(--stage)}
.nav button{background:transparent;color:var(--white);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;white-space:nowrap;font-size:15px}
.nav button:hover:not(:disabled){background:var(--gold);color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.prog{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;min-width:20px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s}
.count{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== identidad visual: fresca, redondeada, con los colores de ReciPunto ===== */
body{color:var(--text)}
.stage{background:radial-gradient(rgba(255,200,61,.20) 2px,transparent 3px) 0 0/34px 34px,radial-gradient(ellipse at 50% 35%,#11694f 0%,var(--stage) 75%)}
.pg{color:var(--text);background:radial-gradient(circle at 100% 0,rgba(18,183,106,.11) 0 96px,transparent 97px),radial-gradient(circle at 0 100%,rgba(255,200,61,.20) 0 74px,transparent 75px),var(--paper)}
.rh{border-bottom:2px dotted var(--teal)}
.rh b{font-family:var(--display);font-weight:600;letter-spacing:.05em;color:var(--ink)}
.folio b{font-family:var(--display);font-weight:600;background:var(--gold);color:var(--ink);border-radius:999px;padding:0 9px}
.band{background:var(--ink);border-left:0;border-radius:20px;padding:14px 20px 15px}
.band .k{display:inline-block;background:var(--gold);color:var(--ink);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;padding:1px 12px;border-radius:999px;transform:rotate(-2deg)}
.band h2{font-family:var(--display);font-weight:600;font-size:14pt;line-height:1.2;margin-top:7px}
h3{font-family:var(--display);font-weight:600;font-size:14pt;color:var(--ink);border-bottom:0;padding:0 0 0 20px;position:relative}
h3::before{content:"";position:absolute;left:0;top:.38em;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--teal)}
h4,.card h4,.box h4,.plan h4,.bio h4,.phase h4{font-family:var(--display);font-weight:600;color:var(--ink)}
.card{border:0;border-radius:18px;background:var(--mint);padding:12px 15px}
.card.gold{background:var(--cream)}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.box{border-left:0;border-radius:18px}
.box.gold{background:var(--cream)}
.tw{border-radius:14px;border:1px solid var(--line);overflow:hidden}
th{background:var(--ink);font-family:var(--display);font-weight:500}
td{border-color:var(--line)}
.photo{border-radius:16px}
.stat{border-radius:18px;background:var(--ink)}
.stat b{font-weight:700}
.grid3 .stat:nth-child(2){background:var(--gold);color:var(--ink)}
.grid3 .stat:nth-child(2) b{color:var(--ink)}
.grid3 .stat:nth-child(3){background:var(--teal);color:var(--ink)}
.grid3 .stat:nth-child(3) b{color:var(--ink)}
.steps div{border:0;border-radius:16px;background:var(--mint)}
.steps div:nth-child(2){background:var(--cream)}
.steps b{font-weight:700;color:var(--leaf)}
.quote{font-family:var(--display);font-weight:500;font-size:20px;border-left:0;background:var(--cream);border-radius:18px;padding:14px 18px;color:var(--ink)}
.toc .no{font-weight:700;color:var(--leaf)}
.toc button{color:var(--text)}
.toc .t b{font-family:var(--display);font-weight:500}
.how b,.bio .role,.plan .who,.pos,a{color:var(--leaf)}
.bio img{border-color:var(--gold)}
.flip .a,.flip .z{border-radius:18px}
.flip .a b{font-weight:600}
.grid2 .flip:nth-child(2) .a,.grid2 .flip:nth-child(3) .a{background:var(--teal)}
.grid2 .flip:nth-child(2) .a b,.grid2 .flip:nth-child(3) .a b,.grid2 .flip:nth-child(2) .a small,.grid2 .flip:nth-child(3) .a small{color:var(--ink)}
.plan{border-radius:18px;border-color:var(--line)}
.plan.best::before{color:var(--ink);font-family:var(--display);font-weight:500}
.plan .pr{font-weight:700;color:var(--ink)}
.switch button{font-family:var(--display)}
.tabs button{font-family:var(--display);font-weight:500;color:var(--ink)}
.phase{border:0;border-radius:16px;background:var(--cream)}
.calc{border-radius:18px}
.calc .out b{font-weight:600}
.calc .verdict{border-radius:999px}
.calc .verdict.ok{color:var(--ink)}
.cols .col{border-radius:8px 8px 0 0}
.bar .tr{border-radius:999px;height:18px}
.bar b{font-weight:600;color:var(--ink)}
.canvas div{border-radius:14px}
.nav button{font-family:var(--display)}
/* portada */
.pg.cov.c1{background:radial-gradient(circle at 12% 62%,rgba(255,255,255,.35) 0 14px,transparent 15px),radial-gradient(circle at 78% 18%,rgba(255,255,255,.35) 0 10px,transparent 11px),radial-gradient(circle at 60% 44%,rgba(255,255,255,.3) 0 7px,transparent 8px),var(--gold);color:var(--ink)}
.pg.cov.c2{background:var(--ink);color:var(--white)}
.cov .c{padding:40px var(--pad) 30px}
.cov .ed{color:var(--ink);font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em}
.mast{font-family:var(--display);font-weight:700;font-size:calc(var(--pw)*.15);line-height:.9;letter-spacing:0}
.c1 .mast{color:var(--ink)}
.mast i{font-style:normal;font-weight:500}
.c1 .mast i{color:var(--leaf)}
.cov .tag{border-top:0;font-style:normal;font-family:var(--display);font-weight:500;font-size:19px;color:var(--ink);max-width:22em}
.cov .foot{color:var(--ink);font-family:var(--display);font-size:14px;max-width:48%}
.cov .hero{position:absolute;right:calc(var(--pad)*.6);bottom:26px;width:46%}
.cov .lbl{font-family:var(--display);font-weight:600;border-radius:999px;transform:rotate(-2deg)}
.cov h1{font-family:var(--display);font-weight:700;font-size:calc(var(--pw)*.07)}
.cov h1 em{font-style:normal;color:var(--gold)}
.cov .sub{font-style:normal;font-family:var(--display);font-weight:400;font-size:20px;color:#d7f0e2}
.cov .facts{gap:12px}
.cov .facts div{border-top:0;background:var(--white);color:var(--ink);border-radius:16px;padding:10px 12px;font-family:var(--display);font-size:14px;transform:rotate(-1.5deg)}
.cov .facts div:nth-child(2){background:var(--gold);transform:rotate(1.5deg)}
.cov .facts div:nth-child(3){background:var(--teal)}
.cov .facts b{color:var(--ink);font-weight:700;font-size:32px}
.open{font-family:var(--display);font-weight:600}
.cov .punti{position:absolute;right:var(--pad);top:34px;width:110px}
.cov.end .mast{color:var(--white)}
.cov.end .mast i{color:var(--gold)}

/* portada de una página (libro cerrado) */
.pg.cov.one{background:radial-gradient(circle at 14% 46%,rgba(255,255,255,.4) 0 12px,transparent 13px),radial-gradient(circle at 86% 8%,rgba(255,255,255,.4) 0 9px,transparent 10px),radial-gradient(circle at 52% 30%,rgba(255,255,255,.3) 0 6px,transparent 7px),var(--gold);color:var(--ink)}
.one .top{position:absolute;inset:0 0 auto 0;padding:34px var(--pad) 0}
.one .mast{color:var(--ink);font-size:calc(var(--pw)*.165);line-height:.92;margin-top:8px}
.one .mast i{color:var(--leaf);font-size:.42em;margin-right:.14em}
.one .tag{margin-top:14px;padding-top:0;max-width:52%;font-size:18px;line-height:1.3}
.one .hero{position:absolute;right:calc(var(--pad)*.7);top:31%;width:35%;z-index:2}
.one .bot{position:absolute;inset:55% 0 0 0;background:var(--ink);color:var(--white);border-radius:46px 46px 0 0;padding:24px var(--pad) 16px;display:flex;flex-direction:column;gap:11px;justify-content:center}
.one .lbl{align-self:flex-start}
.one h1{font-size:calc(var(--pw)*.057);max-width:60%}
.one .facts{margin-top:2px}
.one .facts b{font-size:28px}
.one .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.one .open{margin-top:0}
.one .foot{color:#d7f0e2;max-width:none;font-size:13px;line-height:1.35;flex:1;min-width:0}
.pg.first .one .mast span,.pg.cov.one.first .mast span{animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.cov.end .c{background:var(--ink)}
.cov.end .mast{font-size:calc(var(--pw)*.13);line-height:.95}
.cov.end .colo{font-family:var(--display);font-size:14px;line-height:1.5;color:#d7f0e2;text-align:center;margin:0}
/* marca */
.logo{background:var(--cream);border-radius:20px;padding:18px 22px;display:flex;align-items:center;gap:18px}
.logo img{width:104px;flex:none}
.logo .wm{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--ink)}
.logo .wm span{color:var(--teal)}
.logo .sl{font-family:var(--display);font-weight:500;font-size:20px;color:var(--leaf);margin-top:4px}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.swatches div{border-radius:16px;padding:44px 10px 10px;font-family:var(--display);font-size:13px;line-height:1.25;border:1px solid var(--line);color:var(--ink)}
.swatches b{display:block;font-weight:600}
.typo{background:var(--cream);border-radius:18px;padding:12px 18px;display:flex;align-items:center;gap:18px;font-family:var(--display);color:var(--ink)}
.typo .aa{font-weight:700;font-size:74px;line-height:1;color:var(--teal)}
.typo b{display:block;font-weight:600;font-size:24px}
.typo span{display:block;font-size:18px;color:var(--leaf);font-weight:500}
.typo small{font-size:14px;color:var(--text)}
.side.masc{grid-template-columns:120px 1fr;align-items:center}
@media (max-width:640px){.nav .lblx{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<section data-break="1" data-title="Introducción">
<div class="band"><div class="k">Para empezar</div><h2>Introducción</h2></div>
<p>Jean-Baptiste Say (1803) describió al emprendedor como quien traslada recursos de donde rinden poco a donde rinden más, y asume el riesgo de hacerlo. Joseph Schumpeter (1934) añadió que el motor del progreso es la <strong>innovación</strong>: una «nueva combinación» de cosas que ya existían. Pocas cosas rinden tan poco como la basura mezclada, y pocas combinaciones son tan actuales como unir reciclaje, inteligencia artificial y programas de puntos.</p>
<div class="grid3">
<div class="stat"><b><span data-count="4800">4,800</span> t</b><span>de residuos sólidos genera Panamá cada día (MiAmbiente, s.f.)</span></div>
<div class="stat"><b><span data-count="2.01" data-dec="2">2.01</span></b><span>miles de millones de toneladas al año en el mundo (Kaza et al., 2018)</span></div>
<div class="stat"><b><span data-count="13">13</span> %</b><span>de los emprendimientos panameños nace de una oportunidad (AMPYME, 2020b)</span></div>
</div>
<p>El problema está a la vista. Panamá genera unas 4,800 toneladas de residuos al día (MiAmbiente, s.f.) y la mayor parte termina enterrada en rellenos como Cerro Patacón. El país tiene desde 2018 una política de Basura Cero (Ley 33 de 2018), y autores como Ellen MacArthur y Tom Szaky han mostrado que los residuos pueden volver a la economía como materia prima (Ellen MacArthur Foundation, s.f.; Szaky, 2014). Aun así, ninguna ley logra por sí sola que una persona con un vaso en la mano elija el recipiente correcto.</p>
<p>Esta edición de <strong>Punto de Partida</strong> presenta un plan de negocio que elimina esa decisión: <strong>SmartWaste Station</strong>, una estación que reconoce y separa los residuos por sí sola y premia con puntos a quien recicla. Las estaciones se alquilan a centros comerciales y aeropuertos, y el material separado se vende a la industria. La idea nació en 2024 como proyecto del equipo NeuroEcoWaste Solutions en Samsung Innovation Campus (NeuroEcoWaste Solutions, 2024; Samsung Newsroom Latinoamérica, 2025).</p>
</section>

<p>Estudio Ingeniería de Software en la Universidad Tecnológica de Panamá. En 2024 participé en Samsung Innovation Campus con el equipo NeuroEcoWaste Solutions, donde construimos el prototipo que dio origen a esta idea.</p></div>

<div class="box gold"><h4>Carta del autor</h4>
<p>Querido lector: con mi equipo construimos, con una caja de cartón y una cámara, una estación que separa la basura sola. Pero un prototipo que funciona todavía no es una empresa. En Formación Empresarial encontré lo que faltaba: definir quién paga, cuánto y por qué. Ojalá esta revista te anime a ver tus proyectos de clase como el comienzo de un negocio.</p>
<p><strong>Winson Fu</strong></p></div>

<section data-title="La idea de negocio">
<div class="band"><div class="k">Contenido 1 · La idea de negocio</div><h2>SmartWaste Station: misión, visión y función dentro del emprendimiento</h2></div>
<p><strong>SmartWaste Station</strong> es una estación inteligente de clasificación de residuos. Parte de un prototipo que desarrollé con el equipo NeuroEcoWaste Solutions (2024). El visitante no tiene que saber en qué recipiente va cada cosa: deposita el residuo en una sola entrada, una cámara lo reconoce y la estación lo lleva por sí sola al contenedor que corresponde: <strong>vidrio, cartón, metal o plástico</strong>. El usuario activa la estación desde un chat de Telegram, sin instalar nada, y en ese mismo chat acumula puntos que canjea por descuentos en las tiendas asociadas. El negocio consiste en fabricar estas estaciones, alquilarlas a centros comerciales y aeropuertos, y vender el material ya separado.</p>

<h3>Misión</h3>
<p>Hacer que reciclar sea tan fácil como soltar el residuo, y que tenga recompensa, para que más material vuelva a la industria y menos llegue al vertedero.</p>
<h3>Visión</h3>
<p>Ser, en cinco años, la red de estaciones de reciclaje con recompensas más grande de Panamá, presente en los principales centros comerciales, terminales y aeropuertos del país.</p>
<h3>Valores</h3>
<p>Transparencia en las cifras de reciclaje, respeto por los datos del usuario, trabajo con los recicladores locales y mejora continua.</p>
</div>
</div>
<h3>Cómo funciona, en tres pasos</h3>
<div class="steps"><div><b>1</b>El visitante activa la estación desde el chat de Telegram y deposita su residuo.</div><div><b>2</b>La estación lo reconoce con su cámara y lo lleva sola al contenedor correcto.</div><div><b>3</b>El chat le suma puntos para canjear en tiendas, y el material separado se vende a recicladoras.</div></div>
<p>La idea ya se probó con un primer prototipo, hecho con una caja de cartón, una cámara y una computadora portátil. Bastó para demostrar que funciona: la estación distingue los cuatro tipos de residuos y registra los puntos de cada usuario. El paso siguiente, que es el tema de esta revista, es convertir ese prototipo en un producto resistente y en una empresa.</p>
<h3>Función dentro del emprendimiento</h3>
<p>SmartWaste conecta a cuatro actores que hoy no se hablan, y cada uno recibe algo a cambio. Esa es su función: organizar un intercambio que antes no existía.</p>
<div class="grid2">
<div class="card"><h4>El visitante</h4><p>Recicla sin esfuerzo y gana puntos que valen descuentos reales.</p></div>
<div class="card gold"><h4>El centro comercial o aeropuerto</h4><p>Alquila la estación, reduce lo que paga por recolección y obtiene un reporte de sostenibilidad con datos medidos.</p></div>
<div class="card gold"><h4>La tienda asociada</h4><p>Recibe clientes que llegan a canjear sus puntos y aparece en la pantalla de la estación.</p></div>
<div class="card"><h4>La industria recicladora</h4><p>Compra material ya separado y limpio, que vale más que el mezclado.</p></div>
</div>
</section>
<section data-title="La marca">
<div class="band"><div class="k">La marca</div><h2>Identidad de SmartWaste: cómo se ve y cómo habla</h2></div>
<p>Un negocio que le pide a la gente cambiar un hábito necesita caer bien. La identidad de SmartWaste busca que la estación se reconozca de lejos y que reciclar se sienta como un juego. Usa una letra redondeada, Fredoka, la misma de los títulos de esta revista.</p>

<p class="cap"><strong>Figura 2.</strong> Logotipo y lema de SmartWaste. Elaboración propia.</p>
<h3>El logotipo</h3>
<p>La flecha circular representa el reciclaje: el material sale y vuelve. El punto amarillo del centro es lo que gana el usuario. El nombre se escribe en dos colores: <strong>Smart</strong>, porque la estación clasifica sola, y <strong>Waste</strong>, residuos en inglés.</p>
<h3>Los colores</h3>
<div class="swatches brandviz" data-h="133" data-img="brand_colors.png" data-w="620">
<div style="background:#12B76A"><b>Verde SmartWaste</b>#12B76A</div>
<div style="background:#0B4A3A;color:#fff"><b>Verde Bosque</b>#0B4A3A</div>
<div style="background:#FFC83D"><b>Amarillo Punto</b>#FFC83D</div>
<div style="background:#FF6B4A"><b>Coral</b>#FF6B4A</div>
<div style="background:#FFF8E7"><b>Crema</b>#FFF8E7</div>
</div>
<p>El <strong>verde</strong> comunica reciclaje y avance, como la luz de un semáforo. El <strong>verde bosque</strong> es el color de la estación y de los textos. El <strong>amarillo</strong> se reserva para los puntos y los premios, de modo que el usuario aprenda que amarillo significa ganar. El <strong>coral</strong> se usa poco, para avisos y promociones, y el <strong>crema</strong> da un fondo cálido a las pantallas.</p>

<h3>El tono de voz</h3>
<p>SmartWaste tutea, usa frases cortas y celebra. Nunca usa lenguaje técnico ni regaña: dice en una línea qué pasó y qué sigue.</p>
<div class="tw"><table>
<tr><th>En lugar de decir…</th><th>SmartWaste dice…</th></tr>
<tr><td>Debe introducir el token de usuario para el registro de puntos.</td><td>Escribe tu código y empezamos a sumar puntos.</td></tr>
<tr><td>Deposite el residuo en el contenedor correspondiente.</td><td>Suéltalo aquí. Yo lo clasifico.</td></tr>
<tr><td>Registro exitoso. Desecho: vidrio. Puntos: 1.</td><td>¡Buen tiro! Era vidrio. +1 punto.</td></tr>
<tr><td>Saldo insuficiente para el canje.</td><td>Te faltan 12 puntos. ¡Ya casi es tuyo!</td></tr>
</table></div>
</section>
<section data-title="Formación">
<div class="band"><div class="k">Contenido 2 · Formación</div><h2>Importancia en la formación del emprendedor</h2></div>
<p>El ensayo que escribimos en clase definía el espíritu emprendedor como un conjunto de habilidades que se aprenden haciendo. SmartWaste las exige todas, porque combina tecnología, logística y negociación. Para quien estudia Ingeniería de Software es además una lección de humildad: el programa es solo una parte, y el negocio se gana o se pierde en la calle.</p>
<p class="cap kn" style="text-align:left">Toca cada tarjeta para ver qué habilidad pone a prueba este proyecto.</p>
<div class="grid2">
<button aria-pressed="false" class="flip" type="button"><div class="f"><div class="a"><b>Visión</b><small>Tocar para girar</small></div><div class="z">Ver un recurso donde los demás ven basura, y un cliente donde otros ven un gasto de limpieza.</div></div></button>
<button aria-pressed="false" class="flip" type="button"><div class="f"><div class="a"><b>Innovación</b><small>Tocar para girar</small></div><div class="z w">Enseñar a una cámara a distinguir vidrio, cartón, metal y plástico, para que la persona no tenga que hacerlo.</div></div></button>
<button aria-pressed="false" class="flip" type="button"><div class="f"><div class="a"><b>Negociación y liderazgo</b><small>Tocar para girar</small></div><div class="z w">Convencer al administrador del centro comercial, a las tiendas y a la empresa recicladora de que todos ganan.</div></div></button>
<button aria-pressed="false" class="flip" type="button"><div class="f"><div class="a"><b>Perseverancia</b><small>Tocar para girar</small></div><div class="z">Un prototipo de hardware falla muchas veces antes de funcionar: se atasca, se llena o se desconecta. Hay que volver a intentarlo.</div></div></button>
</div>
<h3>Emprender por oportunidad, no solo por necesidad</h3>
<div class="bars">
<div class="bar"><span>Emprende por necesidad</span><div class="tr"><i style="--w:87%"></i></div><b>87 %</b></div>
<div class="bar"><span>Emprende por oportunidad</span><div class="tr"><i style="--w:13%;--c:var(--teal)"></i></div><b>13 %</b></div>
</div>
<p class="cap"><strong>Figura 3.</strong> Motivo para emprender en Panamá. Elaboración propia con datos de AMPYME (2020b).</p>
<p>En Panamá, el 87 % de quienes emprenden en etapa temprana lo hace por necesidad y solo el 13 % por una oportunidad de mercado (AMPYME, 2020b). SmartWaste pertenece al segundo grupo: nace de detectar un problema ambiental que crece cada año y de proponer una solución que antes no existía en el país. Formar emprendedores capaces de ver ese tipo de oportunidades es precisamente lo que busca este curso.</p>
</section>
<section data-title="Comunidad">

<div><p>Los recipientes de colores existen desde hace años y casi nadie los usa bien. Exigen saber qué va en cada uno y no ofrecen lo que mueve a las personas y a las empresas: un beneficio inmediato. Como recuerda Szaky (2014), la basura no existe en la naturaleza; es un problema de diseño, y se puede rediseñar.</p><p>SmartWaste reparte ese beneficio entre toda la comunidad empresarial que rodea a cada estación, y de paso atiende tres de los Objetivos de Desarrollo Sostenible de las Naciones Unidas (2015): ciudades sostenibles (ODS 11), producción y consumo responsables (ODS 12) y acción por el clima (ODS 13).</p></div>

<div class="grid2">
<div class="card"><h4>Para el ambiente</h4><p>Cada kilogramo clasificado es un kilogramo que no ocupa espacio en el relleno sanitario y que reemplaza materia prima nueva.</p></div>
<div class="card gold"><h4>Para los comercios</h4><p>Las tiendas asociadas reciben visitantes con un motivo para entrar, y el centro comercial mejora su imagen con cifras verificables.</p></div>
<div class="card gold"><h4>Para los recicladores</h4><p>Las empresas y cooperativas de reciclaje reciben material limpio y constante, lo que les da ingresos más estables.</p></div>
<div class="card"><h4>Para la ciudadanía</h4><p>Reciclar deja de ser un sacrificio y se vuelve un hábito con recompensa, que luego se repite en casa.</p></div>
</div>
<div class="box"><h4>La otra cara: evitar el «lavado verde»</h4><p>En el ensayo de clase vimos que la búsqueda de ganancias puede desviar incluso las buenas ideas. Un negocio ambiental corre el riesgo de vender imagen y no resultados. SmartWaste asume tres compromisos: publicar los kilogramos realmente entregados a recicladoras, no vender los datos personales de los usuarios y no prometer a sus clientes más de lo que las estaciones miden.</p></div>
</section>

<p>La zonificación tiene dos sentidos para este proyecto. El primero es el <strong>uso de suelo</strong>. Las estaciones se instalan dentro de centros comerciales y terminales, que ya tienen uso comercial y sus propios permisos, de modo que operan bajo un contrato con el anfitrión. Lo que sí necesita ubicación propia es el <strong>centro de acopio y taller</strong>, donde se almacena el material y se reparan las estaciones: debe estar en un local cuyo uso de suelo permita actividad industrial liviana o de almacenamiento, y hay que verificarlo antes de firmar el alquiler. Como se manejan residuos, también se requieren los permisos sanitarios y municipales correspondientes.</p>
<p>El segundo sentido es la <strong>zona de mercado</strong>: dónde hay más gente consumiendo y, por lo tanto, más envases. El plan avanza en tres fases. Elige una para ver sus actividades:</p>

<section data-title="Tarifas, herramientas y estructura">
<div class="band"><div class="k">Contenido 5 · Los números</div><h2>Tarifas, herramientas, estructura y evaluación del proyecto</h2></div>
<h3>Tarifas</h3>
<p>Para el visitante, usar la estación es gratis: cada envase bien clasificado le da <strong>1 punto</strong>, y <strong>100 puntos equivalen a B/. 1.00</strong> de descuento, que la tienda asume como promoción. Pagan quienes reciben el servicio: el lugar anfitrión, que alquila la estación, y las tiendas que quieren atraer a los usuarios.</p>
<div class="swbox kn"><div aria-label="Ver precios" class="switch" role="group"><button aria-pressed="true" data-y="0" type="button">Precio al mes</button><button aria-pressed="false" data-y="1" type="button">Costo en un año</button></div></div>
<div class="grid3">
<div class="plan"><h4>Estación Esencial</h4><div class="pr">B/. <span class="price" data-m="290">290.00</span> <small class="per">al mes</small></div><p>Estación instalada, mantenimiento, recolección semanal y reporte mensual de kilogramos.</p><p class="who">Para centros comerciales medianos</p></div>
<div class="plan best"><h4>Estación Plus</h4><div class="pr">B/. <span class="price" data-m="390">390.00</span> <small class="per">al mes</small></div><p>Todo lo anterior, más recolección tres veces por semana, pantalla con la marca del anfitrión y reporte de sostenibilidad.</p><p class="who">Para grandes centros comerciales y aeropuertos</p></div>
<div class="plan"><h4>Tienda asociada</h4><div class="pr">B/. <span class="price" data-m="45">45.00</span> <small class="per">al mes</small></div><p>Aparece en el catálogo de canje y en la pantalla de las estaciones del lugar, con estadísticas de canjes.</p><p class="who">Para tiendas y restaurantes del lugar</p></div>
</div>
<p class="cap">Precios por estación o por tienda; no incluyen el 7 % de ITBMS. Tarifas propuestas por el autor.</p>


<h3>Herramientas</h3>
<p>Para diseñar el negocio se usaron tres herramientas vistas en el curso: el <strong>lienzo de modelo de negocio</strong> (anexo A), el <strong>análisis FODA</strong> (anexo B) y el <strong>producto mínimo viable</strong>: una sola estación piloto durante tres meses en un centro comercial, para medir cuánta gente la usa antes de fabricar más (Ries, 2012). En lo técnico basta decir que la estación usa una cámara y un programa que aprendió a reconocer residuos a partir de miles de fotografías. El usuario solo necesita Telegram, y el operador ve en un panel cuánto material hay de cada tipo.</p>
<h3>Estructura</h3>
<p>La empresa se constituirá como <strong>sociedad de emprendimiento</strong> (Ley 186 de 2020, reformada por la Ley 451 de 2024), una figura creada para micro y pequeñas empresas que admite de dos a diez socios y limita la responsabilidad al aporte de cada uno. Tendrá su aviso de operación en Panamá Emprende (Ley 5 de 2007) y registrará la marca SmartWaste en la DIGERPI. La organización inicial es pequeña:</p>

<section data-title="Evaluación del proyecto">
<div class="band"><div class="k">Contenido 5 · Los números</div><h2>Evaluación del proyecto</h2></div>
<p>La evaluación responde a una pregunta sencilla: ¿cuántas estaciones alquiladas necesita SmartWaste para cubrir sus costos? La inversión inicial es de B/. 31,000 por diez estaciones. Cada una deja B/. 400 al mes y cuesta B/. 110 atenderla, de modo que el punto de equilibrio resulta de dividir los costos fijos entre ese margen: B/. 4,350 ÷ (B/. 400 − B/. 110) = <strong>15 estaciones</strong>. Mueve el control para comprobarlo.</p>

<p class="cap"><strong>Figura 6.</strong> Proyección de ingresos y costos operativos de SmartWaste a tres años. Estimaciones propias (anexo C).</p>
<p>El primer año cierra casi en equilibrio y la utilidad llega en el segundo. Sin embargo, este es un negocio que necesita capital: cada estación nueva cuesta B/. 1,500 y las ganancias se reinvierten en fabricar más. Por eso el flujo acumulado sigue negativo al final del tercer año (−B/. 20,020) y la inversión se recupera durante el cuarto. Son estimaciones de un plan académico; antes de invertir habría que validarlas con la estación piloto y con cartas de intención de al menos dos centros comerciales.</p>

<section data-title="Conclusión">
<div class="band"><div class="k">Cierre de la edición</div><h2>Conclusión</h2></div>
<p>Preparar esta revista permitió unir en un solo proyecto los temas del curso. La primera conclusión es que <strong>una buena idea de negocio nace de un problema real y visible</strong>. Panamá genera unas 4,800 toneladas de residuos al día y tiene una política de Basura Cero que todavía no cambia lo que ocurre frente al basurero. SmartWaste no inventa el reciclaje: le agrega el incentivo que faltaba, y lo coloca justo donde la persona decide.</p>
<p>La segunda conclusión es que <strong>la misión solo se sostiene si el modelo de negocio la paga</strong>. Una estación de reciclaje sin ingresos es un gasto que alguien cancelará tarde o temprano. Por eso el plan no depende de donaciones ni del precio del plástico: el centro comercial alquila un servicio, la tienda paga por recibir clientes y el material clasificado aporta un ingreso adicional. Cada actor gana algo, y esa es la razón por la que el sistema puede durar.</p>
<p>La tercera conclusión es que <strong>los números obligan a ser honesto con la idea</strong>. El punto de equilibrio de 15 estaciones es alcanzable en el primer año, pero la proyección muestra que crecer exige capital y que la inversión tarda cerca de cuatro años en recuperarse. Emprender, como decía Say, implica asumir un riesgo; evaluarlo antes de empezar es la diferencia entre arriesgarse y apostar a ciegas. La zonificación sigue la misma lógica: primero los centros comerciales de la capital, donde hay más visitantes, y después el aeropuerto y el interior.</p>
<p>Por último, este trabajo confirma que la formación técnica y el espíritu emprendedor se necesitan mutuamente. El proyecto empezó como un prototipo tecnológico y solo se convierte en empresa cuando alguien define quién paga, cuánto y por qué. Para un estudiante de Ingeniería de Software, esa es quizá la lección más útil del curso.</p>
<p class="quote">El mejor punto de partida para emprender es un problema que valga la pena resolver. La basura de todos los días es uno de ellos, y cada envase bien clasificado es un punto a favor.</p>
</section>

  var PHS=[
    {t:'Fase 1 · Centros comerciales de la ciudad de Panamá',m:'Meta: 20 estaciones en operación',a:['Estación piloto durante tres meses y ajuste del diseño.','Primeros contratos de alquiler con centros comerciales.','Red inicial de tiendas asociadas en las plazas de comidas.']},
    {t:'Fase 2 · Aeropuerto, terminales, Panamá Oeste y Colón',m:'Meta: 40 estaciones en operación',a:['Estaciones Plus en el aeropuerto y la terminal de transporte.','Segunda ruta de recolección y ampliación del centro de acopio.','Reportes de sostenibilidad para los anfitriones.']},
    {t:'Fase 3 · David, Santiago, Chitré y otros puntos del interior',m:'Meta: 65 estaciones en operación',a:['Alianzas con recicladoras locales para no trasladar el material.','Estaciones en universidades y hospitales.','Evaluación de la expansión a otros países de la región.']}
  ];
  function phase(z,i){
    [].slice.call(z.querySelectorAll('[data-ph]')).forEach(function(t,k){t.setAttribute('aria-selected',k===i?'true':'false')});
    [].slice.call(z.querySelectorAll('.dot')).forEach(function(d,k){d.classList.toggle('on',k<=i)});
    [].slice.call(z.querySelectorAll('.seg')).forEach(function(s,k){s.classList.toggle('on',k<i)});
    var ph=z.querySelector('.phase'),p=PHS[i];ph.textContent='';
    var h=document.createElement('h4');h.textContent=p.t;ph.appendChild(h);
    var ul=document.createElement('ul');p.a.forEach(function(x){var li=document.createElement('li');li.textContent=x;ul.appendChild(li)});ph.appendChild(ul);
    var m=document.createElement('p');m.style.margin='0';var s=document.createElement('strong');s.textContent=p.m;m.appendChild(s);ph.appendChild(m);
    ph.classList.remove('show');void ph.offsetWidth;ph.classList.add('show');
  }
  function calc(c){
    var n=+c.querySelector('input').value,inc=n*400,cost=4350+n*110,res=inc-cost;
    c.querySelector('.cliv').textContent=n;c.querySelector('.oi').textContent='B/. '+fmt(inc,0);c.querySelector('.oc').textContent='B/. '+fmt(cost,0);
    c.querySelector('.or').textContent=(res<0?'−B/. ':'B/. ')+fmt(Math.abs(res),0);
    var v=c.querySelector('.verdict');
    if(n>=15){v.classList.add('ok');v.textContent='Sobre el punto de equilibrio: el negocio cubre sus costos.'}
    else{v.classList.remove('ok');v.textContent='Faltan '+(15-n)+' estaciones para llegar al punto de equilibrio (15).'}
  }
  function prices(box,year){
    var sw=box.querySelector('.switch').children;sw[0].setAttribute('aria-pressed',year?'false':'true');sw[1].setAttribute('aria-pressed',year?'true':'false');
    pages.forEach(function(pg){
      [].slice.call(pg.querySelectorAll('.price')).forEach(function(el){var m=parseFloat(el.dataset.m);el.textContent=fmt(year?m*12:m,2)});
      [].slice.call(pg.querySelectorAll('.per')).forEach(function(el){el.textContent=year?'al año':'al mes'});
    });
  }

  document.addEventListener('click',function(e){
    var t=e.target,b;
    if((b=t.closest('[data-sec]'))){go(secStart[+b.dataset.sec]);return}
    if(t.closest('[data-next]')){step(1);return}
    if((b=t.closest('.flip'))){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');return}
    if((b=t.closest('[data-ph]'))){phase(b.closest('.phz'),+b.dataset.ph);return}
    if((b=t.closest('.switch button'))){prices(b.closest('.swbox'),b.dataset.y==='1');return}
  });
  document.addEventListener('input',function(e){var c=e.target.closest&&e.target.closest('.calc');if(c)calc(c)});
  $('prev').onclick=function(){step(-1)};$('next').onclick=function(){step(1)};$('toc').onclick=function(){go(0)};
  $('fs').onclick=function(){
    try{var el=document.documentElement;
      if(document.fullscreenElement){document.exitFullscreen()}
      else if(el.requestFullscreen){var p=el.requestFullscreen();if(p&&p.catch)p.catch(function(){})}
    }catch(err){}
  };
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();step(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(pages.length-1);
  });
  var sx=0,sy=0,st=null;
  stage.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=e.target},{passive:true});
  stage.addEventListener('touchend',function(e){
    if(st&&st.closest&&st.closest('input,.tw'))return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6)step(dx<0?1:-1);
  },{passive:true});
  var rt=null,lw=0,lh=0;
  function onsize(){clearTimeout(rt);rt=setTimeout(function(){
    if(stage.clientWidth===lw&&stage.clientHeight===lh)return;
    if(busy){onsize();return}
    lw=stage.clientWidth;lh=stage.clientHeight;build(true);
  },120)}
  window.addEventListener('resize',onsize);
  if(window.ResizeObserver)new ResizeObserver(onsize).observe(stage);
  var m=/[?&]p=(\d+)/.exec(location.search);
  build(false);lw=stage.clientWidth;lh=stage.clientHeight;
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!busy){var p0=pos;build(true);if(p0===0){pos=0;render();pages[0].classList.add('first')}}});
  if(m){pos=norm(+m[1]-1);render()}
})();
</script>

</body>
</html>
